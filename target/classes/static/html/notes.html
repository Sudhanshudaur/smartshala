<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Notes - Smartshala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .notes-layout { display: grid; grid-template-columns: 280px 1fr; gap: 1.5rem; min-height: calc(100vh - 150px); }
    .notes-sidebar { background: #eef2ff; padding: 1.5rem; border-radius: 1rem; border: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
    .note-item { padding: 0.75rem; border-radius: 0.5rem; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
    .note-item:hover { background: #fafafa; border-color: #e5e5e5; }
    .note-item.active { background: #f0f0ff; border-color: #c7d2fe; }
    .editor-box { background: #eef2ff; padding: 1.5rem; border-radius: 1rem; border: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
    .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #e5e5e5; }
    #editor { min-height: 300px; padding: 1rem; border: 1px solid #e5e5e5; border-radius: 0.75rem; outline: none; font-size: 1rem; line-height: 1.6; }
    #editor:focus { border-color: var(--bs-primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
    .summary-panel { margin-top: 1rem; padding: 1rem; background: #fafafa; border-radius: 0.75rem; border: 1px solid #e5e5e5; }
    @media (max-width: 768px) { .notes-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg dashboard-nav">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-inline-flex gap-2 align-items-center" href="index.html">
        <span class="material-icons text-primary" style="font-size:24px">school</span>
        <span class="fw-bold">Smartshala</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#dashNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="dashNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-4">
          <li class="nav-item"><a class="nav-link" href="student-dashboard.html"><span class="material-icons">dashboard</span> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="liveclass.html"><span class="material-icons">videocam</span> Live Class</a></li>
          <li class="nav-item"><a class="nav-link" href="lectures.html"><span class="material-icons">video_library</span> Lectures</a></li>
          <li class="nav-item"><a class="nav-link active" href="notes.html"><span class="material-icons">note</span> Notes</a></li>
        </ul>
        <a href="#" id="logout-btn" class="btn btn-outline-primary btn-sm">
          <span class="material-icons" style="font-size:16px">logout</span> Logout
        </a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="notes-layout">
      <aside class="notes-sidebar">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0 fw-bold">My Notes</h5>
          <button class="btn btn-primary btn-sm" id="new-note">
            <span class="material-icons" style="font-size:14px">add</span> New
          </button>
        </div>
        <div class="d-flex flex-column gap-1" id="notes-list">
          <!-- Notes will be inserted here -->
        </div>
      </aside>

      <div class="editor-box">
        <div class="toolbar">
          <button class="btn btn-primary btn-sm" id="save-btn">
            <span class="material-icons" style="font-size:14px">save</span> Save
          </button>
          <button class="btn btn-outline-primary btn-sm" id="summarize-btn">
            <span class="material-icons" style="font-size:14px">auto_awesome</span> AI Summarize
          </button>
          <button class="btn btn-outline-danger btn-sm" id="delete-btn">
            <span class="material-icons" style="font-size:14px">delete</span> Delete
          </button>
          <input type="text" id="note-title" placeholder="Note title" class="form-control form-control-sm flex-fill" style="border-radius:50rem" />
        </div>

        <div id="editor" contenteditable="true" style="white-space:pre-wrap" placeholder="Start typing your notes here..."></div>

        <div id="summary-panel" class="summary-panel" style="display:none">
          <h6 class="mb-2">
            <span class="material-icons text-primary" style="font-size:16px;vertical-align:middle">auto_awesome</span> AI Summary
          </h6>
          <div id="summary-content"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/theme-toggle.js"></script>
  <script>
    const user = Smartshala.getCurrentUser();
    if (!user || !user.isAuthenticated || user.role !== 'student') {
      window.location.href = 'login.html';
    }

    const notesList = document.getElementById('notes-list');
    const titleInput = document.getElementById('note-title');
    const editor = document.getElementById('editor');
    const summaryPanel = document.getElementById('summary-panel');
    const summaryContent = document.getElementById('summary-content');
    editor.addEventListener('input', () => isDirty = true);
    titleInput.addEventListener('input', () => isDirty = true);
    let notes = [];
    let activeNoteId = null;
    let latestSummary = '';
    let isDirty = false;

    async function loadNotes() {
      try {
        const res = await apiFetch('/api/notes', { headers: { Authorization: `Bearer ${user.token}` } });
        notes = await res.json();
        renderNotes();
        if (!activeNoteId && notes.length) selectNote(notes[0].id);
      } catch (err) {
        notesList.innerHTML = '<p class="text-danger small">Unable to load notes.</p>';
      }
    }

    function renderNotes() {
      notesList.innerHTML = notes.map(note => `
        <div class="note-item ${note.id === activeNoteId ? 'active' : ''}" onclick="selectNote('${note.id}')">
          <div class="fw-semibold">${note.title}</div>
          <div class="text-muted small">${note.created_at ? new Date(note.created_at).toLocaleDateString() : ''}</div>
        </div>
      `).join('') || '<p class="text-muted small">No notes yet.</p>';
    }

    window.selectNote = async (id) => {
      if (isDirty && !await Smartshala.confirm('You have unsaved changes. Discard them?')) return;
      const note = notes.find(item => item.id === id);
      if (!note) return;
      activeNoteId = id;
      titleInput.value = note.title || '';
      editor.textContent = note.content || '';
      latestSummary = note.summary || '';
      if (latestSummary) {
        summaryPanel.style.display = 'block';
        summaryContent.textContent = latestSummary;
      } else {
        summaryPanel.style.display = 'none';
        summaryContent.textContent = '';
      }
      isDirty = false;
      renderNotes();
    };

    document.getElementById('new-note').addEventListener('click', async () => {
      if (isDirty && !await Smartshala.confirm('You have unsaved changes. Discard them?')) return;
      activeNoteId = null;
      latestSummary = '';
      isDirty = false;
      titleInput.value = '';
      editor.textContent = '';
      summaryPanel.style.display = 'none';
      renderNotes();
      titleInput.focus();
    });

    document.getElementById('save-btn').addEventListener('click', async () => {
      const saveBtn = document.getElementById('save-btn');
      btnLoading(saveBtn, true);
      const title = titleInput.value.trim();
      const content = editor.innerText.trim();
      if (!title || !content) {
        btnLoading(saveBtn, false, '<span class="material-icons" style="font-size:14px">save</span> Save');
        await Smartshala.alert('Add a title and note content first.');
        return;
      }
      const url = activeNoteId ? `/api/notes/${activeNoteId}` : '/api/notes';
      const method = activeNoteId ? 'PUT' : 'POST';
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${user.token}` },
        body: JSON.stringify({ title, content, summary: latestSummary })
      });
      if (!res.ok) {
        btnLoading(saveBtn, false, '<span class="material-icons" style="font-size:14px">save</span> Save');
        await Smartshala.alert('Note save failed.');
        return;
      }
      const saved = await res.json();
      activeNoteId = saved.id;
      isDirty = false;
      btnLoading(saveBtn, false, '<span class="material-icons" style="font-size:14px">save</span> Save');
      await loadNotes();
      Smartshala.toast('Note saved');
    });

    document.getElementById('summarize-btn').addEventListener('click', async () => {
      const content = editor.innerText.trim();
      if (!content) return;
      summaryPanel.style.display = 'block';
      summaryContent.innerHTML = '<div style="animation:pulse 1.5s infinite;color:#737373">Generating summary...</div>';
      try {
        const res = await apiFetch('/api/ai/summarize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${user.token}` },
          body: JSON.stringify({ text: content })
        });
        if (!res) return;
        const data = await res.json();
        latestSummary = data.summary || data.error || '';
        summaryContent.innerHTML = `
          <p class="mb-2">${latestSummary}</p>
          ${(data.keywords || []).length ? `<div class="text-muted small">Keywords: ${data.keywords.join(', ')}</div>` : ''}
        `;
      } catch (err) {
        summaryContent.textContent = 'Summary failed. Please try again.';
      }
    });

    document.getElementById('delete-btn').addEventListener('click', async () => {
      if (!activeNoteId) return;
      if (!await Smartshala.confirm('Delete this note?')) return;
      const res = await apiFetch(`/api/notes/${activeNoteId}`, { method: 'DELETE', headers: { Authorization: `Bearer ${user.token}` } });
      if (res.ok) {
        activeNoteId = null;
        titleInput.value = '';
        editor.textContent = '';
        latestSummary = '';
        summaryPanel.style.display = 'none';
        loadNotes();
      }
    });

    document.getElementById('logout-btn').addEventListener('click', (e) => {
      e.preventDefault();
      Smartshala.logout();
    });

    loadNotes();
  </script>
</body>
</html>
