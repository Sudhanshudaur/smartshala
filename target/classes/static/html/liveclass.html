<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Class - Smartshala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .live-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:1.5rem}
    .video-wrap{background:#111;border-radius:1rem;overflow:hidden;position:relative;min-height:420px;display:flex;align-items:center;justify-content:center}
    .video-wrap video{width:100%;height:100%;object-fit:contain;display:block}
    .local-label{position:absolute;left:.75rem;bottom:.75rem;background:rgba(0,0,0,.6);color:#fff;font-size:.75rem;padding:.2rem .6rem;border-radius:50rem;pointer-events:none}
    .rec-dot{display:inline-block;width:8px;height:8px;background:#ef4444;border-radius:50%;margin-right:4px;animation:blink 1s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
    .remote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.75rem;margin-top:1rem}
    .remote-tile{background:#171717;border-radius:.75rem;overflow:hidden;min-height:140px;position:relative}
    .remote-tile video{width:100%;height:100%;object-fit:cover;display:block}
    .remote-label{position:absolute;left:.5rem;bottom:.5rem;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;padding:.2rem .5rem;border-radius:50rem;pointer-events:none;display:flex;align-items:center;gap:.3rem}
    .remote-muted{font-size:14px!important}
    .ice-badge{position:absolute;top:.5rem;right:.5rem;font-size:.65rem;padding:.15rem .4rem;border-radius:50rem}
    .chat-row{margin-bottom:.6rem;padding:.6rem .75rem;border-radius:.75rem;background:#f8fafc}
    .chat-row.mine{background:#eef2ff}
    .chat-row.ai{background:#ecfeff;border:1px solid #a5f3fc}
    .chat-row.system{background:#fafafa;color:#737373;font-size:.82rem;text-align:center}
    .chat-meta{font-size:.72rem;color:#64748b;margin-bottom:.2rem;display:flex;justify-content:space-between}
    .meeting-stat{display:inline-flex;align-items:center;gap:.35rem;border-radius:50rem;padding:.4rem .75rem;background:rgba(255,255,255,.92);color:#3730a3;font-weight:700;font-size:.85rem}
    .ctrl-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem;align-items:center}
    .ctrl-bar .btn{min-height:38px}
    .status-bar{font-size:.8rem;color:#737373;margin-top:.4rem;min-height:1.2em}
    @media(max-width:992px){.live-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg dashboard-nav">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-inline-flex gap-2 align-items-center" href="index.html">
      <span class="material-icons text-primary" style="font-size:24px">school</span>
      <span class="fw-bold">Smartshala</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#dashNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="dashNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-4" id="role-nav"></ul>

        <span class="material-icons" style="font-size:16px">logout</span> Logout
      </a>

</nav>

<main class="container py-4">
  <div class="page-header mb-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 position-relative" style="z-index:1">
      <div>
        <h1><span class="material-icons me-2" style="font-size:1.5rem;vertical-align:middle">videocam</span>Live Class</h1>
        <p id="class-context">WebRTC video &amp; class chat</p>
      </div>
      <div class="d-flex gap-2 flex-wrap align-items-center">
        <span class="meeting-stat"><span class="material-icons" style="font-size:16px">groups</span><span id="participant-count">1</span></span>
        <span class="badge bg-light text-primary rounded-pill px-3 py-2" id="role-badge">—</span>

          <span class="rec-dot"></span>REC

  <div class="live-grid">

        <button class="btn btn-outline-primary" id="cam-btn" style="display:none">

          <span class="material-icons" style="font-size:16px;margin-right:4px">screen_share</span>Screen
        </button>
        <button class="btn btn-primary" id="record-btn" style="display:none">
          <span class="material-icons" style="font-size:16px;margin-right:4px">fiber_manual_record</span>Record
        </button>
        <button class="btn btn-warning" id="stop-rec-btn" style="display:none">

        </button>
        <button class="btn btn-outline-danger" id="leave-btn" style="display:none">
          <span class="material-icons" style="font-size:16px;margin-right:4px">logout</span>Leave
        </button>
        <button class="btn btn-danger" id="end-btn" style="display:none">
          <span class="material-icons" style="font-size:16px;margin-right:4px">call_end</span>End Class
        </button>

    <!-- Chat panel -->
    <aside class="chat-panel">
      <div class="chat-header d-flex align-items-center">
        <span class="material-icons text-primary me-2" style="font-size:18px">forum</span>
        Class Chat
        <span class="badge bg-info-subtle text-info-emphasis ms-auto">AI: /ai &lt;question&gt;</span>
      </div>
      <div class="chat-messages" id="chat"></div>
      <div class="chat-input-area">
        <input id="chat-input" placeholder="Message or /ai question…" autocomplete="off"/>
        <button class="btn btn-outline-primary btn-sm" id="ai-btn" title="Ask AI">
          <span class="material-icons" style="font-size:16px">smart_toy</span>
        </button>
        <button class="btn btn-primary btn-sm" id="send-btn">
          <span class="material-icons" style="font-size:16px">send</span>
        </button>

    </aside>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/theme-toggle.js"></script>
<script>

// ── Auth guard ──────────────────────────────────────────────────────────────
const currentUser = JSON.parse(
  localStorage.getItem('smartshala_auth') ||
  sessionStorage.getItem('smartshala_auth') || 'null'
);
if (!currentUser || !currentUser.isAuthenticated ||
    !['teacher','student','admin'].includes(currentUser.role)) {
  location.href = 'login.html';
}

// ── URL params ───────────────────────────────────────────────────────────────
const params   = new URLSearchParams(location.search);
const CLASS_ID = params.get('classId') || '';
const ROOM     = params.get('room') || CLASS_ID || 'demo-room';
const IS_TEACHER = currentUser.role === 'teacher' || currentUser.role === 'admin';
const WS_URL   = (location.protocol === 'https:' ? 'wss' : 'ws') +
                 '://' + location.host + '/ws?token=' +
                 encodeURIComponent(currentUser.token);

// ── ICE servers (STUN + public TURN fallback) ────────────────────────────────
// Replace TURN credentials with your own server for production
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun2.l.google.com:19302' },
  { urls: 'stun:stun3.l.google.com:19302' },
  {
    urls: 'turn:openrelay.metered.ca:80',
    username: 'openrelayproject',
    credential: 'openrelayproject'
  },
  {
    urls: 'turn:openrelay.metered.ca:443',
    username: 'openrelayproject',
    credential: 'openrelayproject'
  },
  {
    urls: 'turn:openrelay.metered.ca:443?transport=tcp',
    username: 'openrelayproject',
    credential: 'openrelayproject'
  }
];

// ── DOM refs ─────────────────────────────────────────────────────────────────
const $  = id => document.getElementById(id);
const localVideo   = $('localVideo');
const remoteGrid   = $('remote-grid');
const statusBar    = $('status-bar');
const chatBox      = $('chat');
const chatInput    = $('chat-input');
const pCount       = $('participant-count');
const recBadge     = $('rec-badge');
const localLabel   = $('local-label');

// ── State ────────────────────────────────────────────────────────────────────
let ws             = null;
let myId           = null;          // WebSocket session id assigned by server
let localStream    = null;
let screenSharing  = false;
let mediaRecorder  = null;
let recChunks      = [];
let wsReconnTimer  = null;
let wsReconnDelay  = 2000;
let intentClose    = false;
let heartbeatInterval = null;

// peerId → RTCPeerConnection
const peers        = {};
// peerId → perfect-negotiation state
const peerState    = {};
// peerId → { id, name, role }
const peerMeta     = {};
// peerId → { audio, video }
const peerMedia    = {};
// peerId → MediaStream (accumulate tracks)
const peerStreams   = {};

// ── Navbar ───────────────────────────────────────────────────────────────────
$('role-badge').textContent = IS_TEACHER ? 'Teacher' : 'Student';
$('role-nav').innerHTML = IS_TEACHER
  ? `<li class="nav-item"><a class="nav-link" href="teacher-dashboard.html"><span class="material-icons">dashboard</span> Dashboard</a></li>
     <li class="nav-item"><a class="nav-link active" href="liveclass.html"><span class="material-icons">videocam</span> Live</a></li>
     <li class="nav-item"><a class="nav-link" href="lectures.html"><span class="material-icons">video_library</span> Lectures</a></li>`
  : `<li class="nav-item"><a class="nav-link" href="student-dashboard.html"><span class="material-icons">dashboard</span> Dashboard</a></li>
     <li class="nav-item"><a class="nav-link active" href="liveclass.html"><span class="material-icons">videocam</span> Live</a></li>
     <li class="nav-item"><a class="nav-link" href="lectures.html"><span class="material-icons">video_library</span> Lectures</a></li>
     <li class="nav-item"><a class="nav-link" href="notes.html"><span class="material-icons">note</span> Notes</a></li>`;

$('logout-btn').addEventListener('click', e => { e.preventDefault(); Smartshala.logout(); });

// ── Helpers ───────────────────────────────────────────────────────────────────
function setStatus(msg) { statusBar.textContent = msg; }
function show(el, v)    { el.style.display = v ? 'inline-flex' : 'none'; }
function updateCount()  { pCount.textContent = String(1 + Object.keys(peerMeta).length); }

function appendChat({ name='System', role='', message='', mine=false, ai=false, system=false, sentAt=Date.now() }) {
  const d = document.createElement('div');
  d.className = 'chat-row' + (mine?' mine':'') + (ai?' ai':'') + (system?' system':'');
  if (system) {
    d.textContent = message;
  } else {
    d.innerHTML = `<div class="chat-meta"><span>${escHtml(name)}${role?' · '+escHtml(role):''}</span><span>${new Date(sentAt).toLocaleTimeString()}</span></div><div></div>`;
    d.querySelector('div:last-child').textContent = message;
  }
  chatBox.appendChild(d);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}


// ── WebSocket signaling ───────────────────────────────────────────────────────
function openWs() {
  if (ws && ws.readyState <= WebSocket.OPEN) return;
  setStatus('Connecting to signaling server…');
  ws = new WebSocket(WS_URL);

  ws.addEventListener('open', () => {
    wsReconnDelay = 2000;
    ws.send(JSON.stringify({ type: 'join', room: ROOM, classId: CLASS_ID }));
    setStatus('Connected — waiting for peers');
    // Periodically send a heartbeat ping to prevent Render's 57-second idle timeout
    if (heartbeatInterval) clearInterval(heartbeatInterval);
    heartbeatInterval = setInterval(() => {
      wsSend({ type: 'ping' });
    }, 30000);
  });

  ws.addEventListener('message', async e => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    await handleWsMessage(msg);
  });

  ws.addEventListener('close', () => {
    if (heartbeatInterval) {
      clearInterval(heartbeatInterval);
      heartbeatInterval = null;
    }
    if (intentClose) return;
    setStatus(`Disconnected — reconnecting in ${wsReconnDelay/1000}s…`);
    wsReconnTimer = setTimeout(() => {
      wsReconnDelay = Math.min(wsReconnDelay * 2, 30000);
      openWs();
    }, wsReconnDelay);
  });

  ws.addEventListener('error', () => setStatus('WebSocket error'));
}

function wsSend(payload) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(payload));
}

async function handleWsMessage(msg) {
  switch (msg.type) {

    case 'connected':
      myId = msg.id;
      // Fix polite flag for any peers created before we got our id
      for (const [pid, st] of Object.entries(peerState)) st.polite = myId > pid;
      break;

    case 'peers':
      // Existing peers already in the room
      for (const p of (msg.peers || [])) peerMeta[p.id] = p;
      updateCount();
      if (localStream) connectAll();
      break;

    case 'peer-joined':
      peerMeta[msg.peer.id] = msg.peer;
      updateCount();
      appendChat({ message: `${msg.peer.name} joined`, system: true });
      if (localStream) initPeer(msg.peer.id);
      break;

    case 'peer-left':
      removePeer(msg.id);
      updateCount();
      appendChat({ message: 'A participant left', system: true });
      break;

    case 'signal':
      try { await handleSignal(msg.from, msg.data); }
      catch (err) { console.error('[signal]', err); }
      break;

    case 'chat':
      appendChat({
        name: msg.name, role: msg.role, message: msg.message,
        mine: msg.from === myId, sentAt: msg.sentAt
      });
      break;

    case 'end-class':
      appendChat({ message: `${msg.name} ended the class`, system: true });
      if (!IS_TEACHER) {
        await Smartshala.alert('The teacher has ended this class.');
        location.href = CLASS_ID ? `class-details.html?id=${CLASS_ID}` : 'student-dashboard.html';
      }
      break;

    case 'media-state':
      peerMedia[msg.from] = { audio: msg.audio, video: msg.video };
      updateRemoteLabel(msg.from);
      break;

    case 'error':
      appendChat({ message: msg.message || 'Server error', system: true });
      break;
  }
}


// ── WebRTC peer management ────────────────────────────────────────────────────
function initPeer(peerId) {
  if (peers[peerId]) {
    syncTracks(peers[peerId]);
    return peers[peerId];
  }

  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  // Perfect-negotiation state
  peerState[peerId] = {
    makingOffer: false,
    ignoreOffer: false,
    settingRemoteAnswer: false,
    polite: !!myId && myId > peerId
  };

  peers[peerId] = pc;
  peerStreams[peerId] = new MediaStream();
  syncTracks(pc);

  // ── negotiationneeded: create offer ──────────────────────────────────────
  pc.addEventListener('negotiationneeded', async () => {
    const st = peerState[peerId];
    if (!st) return;
    try {
      st.makingOffer = true;
      await pc.setLocalDescription();
      wsSend({ type: 'signal', to: peerId, data: pc.localDescription });
    } catch (err) {
      console.error('[negotiationneeded]', err);
    } finally {
      st.makingOffer = false;
    }
  });

  // ── ICE candidate ready ───────────────────────────────────────────────────
  pc.addEventListener('icecandidate', e => {
    if (e.candidate) wsSend({ type: 'signal', to: peerId, data: { type: 'candidate', candidate: e.candidate } });
  });

  // ── ICE connection state ──────────────────────────────────────────────────
  pc.addEventListener('iceconnectionstatechange', () => {
    const s = pc.iceConnectionState;
    setStatus(`${peerName(peerId)}: ICE ${s}`);
    updateIceBadge(peerId, s);
    if (s === 'failed') pc.restartIce();
  });

  // ── Connection state ──────────────────────────────────────────────────────
  pc.addEventListener('connectionstatechange', () => {
    if (['failed','closed','disconnected'].includes(pc.connectionState)) {
      // Try ICE restart before giving up
      if (pc.connectionState === 'failed') pc.restartIce();
      if (pc.connectionState === 'closed') removePeer(peerId);
    }
  });

  // ── Remote track received ─────────────────────────────────────────────────
  pc.addEventListener('track', e => {
    const stream = peerStreams[peerId] || (peerStreams[peerId] = new MediaStream());
    // Avoid duplicate tracks
    if (!stream.getTrackById(e.track.id)) stream.addTrack(e.track);
    renderRemoteTile(peerId, stream);
  });

  return pc;
}

async function handleSignal(from, data) {
  const pc = initPeer(from);
  const st = peerState[from];
  if (!st) return;

  if (data.type === 'offer' || data.type === 'answer') {
    const desc = new RTCSessionDescription(data);
    const readyForOffer = !st.makingOffer &&
      (pc.signalingState === 'stable' || st.settingRemoteAnswer);
    const collision = desc.type === 'offer' && !readyForOffer;

    st.ignoreOffer = !st.polite && collision;
    if (st.ignoreOffer) return;

    st.settingRemoteAnswer = desc.type === 'answer';
    await pc.setRemoteDescription(desc);
    st.settingRemoteAnswer = false;

    if (desc.type === 'offer') {
      await pc.setLocalDescription();
      wsSend({ type: 'signal', to: from, data: pc.localDescription });
    }
  } else if (data.type === 'candidate' && data.candidate) {
    try {
      await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
    } catch (err) {
      if (!st.ignoreOffer) console.warn('[addIceCandidate]', err);
    }
  }
}

function removePeer(peerId) {
  if (peers[peerId]) { peers[peerId].close(); delete peers[peerId]; }
  delete peerState[peerId];
  delete peerMeta[peerId];
  delete peerMedia[peerId];
  delete peerStreams[peerId];
  const tile = document.getElementById('rt-' + peerId);
  if (tile) tile.remove();
  updateCount();
}

function connectAll() {
  Object.keys(peerMeta).forEach(pid => { if (pid !== myId) initPeer(pid); });
}

function syncTracks(pc) {
  if (!localStream) return;
  localStream.getTracks().forEach(track => {
    const already = pc.getSenders().some(s => s.track && s.track.id === track.id);
    if (!already) pc.addTrack(track, localStream);
  });
}

function peerName(peerId) {
  return peerMeta[peerId] ? peerMeta[peerId].name : peerId.slice(0,8);
}


// ── Remote video tiles ────────────────────────────────────────────────────────
function renderRemoteTile(peerId, stream) {
  let tile = document.getElementById('rt-' + peerId);
  if (!tile) {
    tile = document.createElement('div');
    tile.id = 'rt-' + peerId;
    tile.className = 'remote-tile';
    tile.innerHTML = `
      <video autoplay playsinline></video>
      <span class="remote-label" id="rl-${peerId}"></span>
      <span class="badge ice-badge bg-secondary" id="ib-${peerId}">connecting</span>`;
    remoteGrid.appendChild(tile);
  }
  const vid = tile.querySelector('video');
  if (vid.srcObject !== stream) vid.srcObject = stream;
  updateRemoteLabel(peerId);
}

function updateRemoteLabel(peerId) {
  const el = document.getElementById('rl-' + peerId);
  if (!el) return;
  const meta  = peerMeta[peerId]  || {};
  const media = peerMedia[peerId] || { audio: true, video: true };
  el.innerHTML =
    (!media.audio ? '<span class="material-icons remote-muted">mic_off</span>' : '') +
    escHtml(meta.name || 'Participant');
}

function updateIceBadge(peerId, state) {
  const el = document.getElementById('ib-' + peerId);
  if (!el) return;
  const map = {
    checking:'bg-warning text-dark', connected:'bg-success',
    completed:'bg-success', failed:'bg-danger',
    disconnected:'bg-warning text-dark', closed:'bg-secondary',
    new:'bg-secondary'
  };
  el.className = 'badge ice-badge ' + (map[state] || 'bg-secondary');
  el.textContent = state;
}

// ── Local media ───────────────────────────────────────────────────────────────
async function startMedia() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    localVideo.srcObject = localStream;
    localLabel.textContent = currentUser.name || 'You';
    showMediaControls(true);
    // Add tracks to any already-connected peers
    Object.values(peers).forEach(pc => syncTracks(pc));
    connectAll();
    broadcastMediaState();
    setStatus('Camera and microphone active');
  } catch (err) {
    setStatus('Media error: ' + err.message);
    await Smartshala.alert('Could not access camera/microphone: ' + err.message);
  }
}

function stopMedia() {
  if (!localStream) return;
  localStream.getTracks().forEach(t => t.stop());
  localStream = null;
  localVideo.srcObject = null;
  screenSharing = false;
  Object.values(peers).forEach(pc => pc.getSenders().forEach(s => { try { pc.removeTrack(s); } catch(_){} }));
  showMediaControls(false);
  setStatus('Media stopped');
}

async function toggleMic() {
  if (!localStream) return;
  const tracks = localStream.getAudioTracks();
  tracks.forEach(t => { t.enabled = !t.enabled; });
  const on = tracks.some(t => t.enabled);
  $('mic-btn').innerHTML = `<span class="material-icons" style="font-size:16px;margin-right:4px">${on?'mic':'mic_off'}</span>${on?'Mic On':'Muted'}`;
  $('mic-btn').className = on ? 'btn btn-outline-primary' : 'btn btn-outline-danger';
  broadcastMediaState();
}

async function toggleCam() {
  if (!localStream) return;
  const tracks = localStream.getVideoTracks();
  tracks.forEach(t => { t.enabled = !t.enabled; });
  const on = tracks.some(t => t.enabled);
  $('cam-btn').innerHTML = `<span class="material-icons" style="font-size:16px;margin-right:4px">${on?'videocam':'videocam_off'}</span>${on?'Cam On':'Cam Off'}`;
  $('cam-btn').className = on ? 'btn btn-outline-primary' : 'btn btn-outline-danger';
  broadcastMediaState();
}

async function startScreenShare() {
  if (!localStream) return;
  try {
    const dispStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    const screenTrack = dispStream.getVideoTracks()[0];
    if (!screenTrack) return;
    await replaceVideoTrack(screenTrack);
    screenSharing = true;
    $('screen-btn').innerHTML = '<span class="material-icons" style="font-size:16px;margin-right:4px">stop_screen_share</span>Stop Screen';
    $('screen-btn').className = 'btn btn-warning';
    screenTrack.addEventListener('ended', stopScreenShare);
    setStatus('Screen sharing');
  } catch (err) {
    if (err.name !== 'NotAllowedError') setStatus('Screen share error: ' + err.message);
  }
}

async function stopScreenShare() {
  if (!screenSharing) return;
  screenSharing = false;
  try {
    const camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    await replaceVideoTrack(camStream.getVideoTracks()[0]);
  } catch (err) { setStatus('Camera restore failed: ' + err.message); }
  $('screen-btn').innerHTML = '<span class="material-icons" style="font-size:16px;margin-right:4px">screen_share</span>Screen';
  $('screen-btn').className = 'btn btn-outline-primary';
  setStatus('Camera restored');
}

async function replaceVideoTrack(newTrack) {
  const old = localStream.getVideoTracks()[0];
  if (old) { old.stop(); localStream.removeTrack(old); }
  localStream.addTrack(newTrack);
  localVideo.srcObject = localStream;
  await Promise.all(Object.values(peers).map(pc => {
    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
    return sender ? sender.replaceTrack(newTrack) : Promise.resolve(pc.addTrack(newTrack, localStream));
  }));
}

function broadcastMediaState() {
  if (!localStream) return;
  wsSend({
    type: 'media-state',
    audio: localStream.getAudioTracks().some(t => t.enabled),
    video: localStream.getVideoTracks().some(t => t.enabled)
  });
}


// ── Recording (MediaRecorder API) ─────────────────────────────────────────────
function startRecording() {
  if (!localStream || !IS_TEACHER) return;
  recChunks = [];
  const mime = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
  try {
    mediaRecorder = new MediaRecorder(localStream, mime ? { mimeType: mime } : {});
  } catch (err) { setStatus('Recording init failed: ' + err.message); return; }

  mediaRecorder.addEventListener('dataavailable', e => { if (e.data && e.data.size) recChunks.push(e.data); });
  mediaRecorder.addEventListener('stop', uploadRecording);
  mediaRecorder.start(1000);

  show($('record-btn'), false);
  show($('stop-rec-btn'), true);
  show(recBadge, true);
  setStatus('Recording…');
}

function stopRecording() {
  if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
  mediaRecorder.stop();
  show($('stop-rec-btn'), false);
  show($('record-btn'), true);
  show(recBadge, false);
}

async function uploadRecording() {
  // Upload disabled — feature coming soon
  showComingSoonModal();
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function showMediaControls(hasMedia) {
  show($('mic-btn'),    hasMedia);
  show($('cam-btn'),    hasMedia);
  show($('screen-btn'), hasMedia);
  if (IS_TEACHER) show($('record-btn'), hasMedia);
}

// ── Chat ──────────────────────────────────────────────────────────────────────
function sendChat() {
  const msg = chatInput.value.trim();
  if (!msg) return;
  chatInput.value = '';
  if (/^\s*(\/ai|@ai)\b/i.test(msg)) { askAi(msg); return; }
  if (ws && ws.readyState === WebSocket.OPEN) {
    wsSend({ type: 'chat', message: msg });
  } else {
    appendChat({ message: 'Not connected yet', system: true });
  }
}

async function askAi(raw) {
  const message = raw.replace(/^\s*(\/ai|@ai)\s*/i, '').trim();
  if (!message) return;
  appendChat({ name: currentUser.name || 'Me', role: currentUser.role, message, mine: true });
  try {
    const res = await apiFetch('/api/ai/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + currentUser.token },
      body: JSON.stringify({ message, classId: CLASS_ID })
    });
    if (!res) return;
    const d = await res.json();
    appendChat({ name: 'Smartshala AI', role: 'bot', message: d.reply || d.error || 'No answer', ai: true });
  } catch (err) {
    appendChat({ name: 'Smartshala AI', role: 'bot', message: 'AI unavailable: ' + err.message, ai: true });
  }
}

// ── Leave / End ───────────────────────────────────────────────────────────────
function leaveRoom() {
  intentClose = true;
  clearTimeout(wsReconnTimer);
  if (heartbeatInterval) {
    clearInterval(heartbeatInterval);
    heartbeatInterval = null;
  }
  stopRecording();
  stopMedia();
  Object.keys(peers).forEach(removePeer);
  if (ws) { ws.close(); ws = null; }
  show($('join-btn'), true);
  show($('leave-btn'), false);
  show($('end-btn'), false);
  showMediaControls(false);
  setStatus('You left the room');
}

async function endClass() {
  if (!CLASS_ID) { await Smartshala.alert('Open from a class page to end the session.'); return; }
  if (!await Smartshala.confirm('End this live class for everyone?')) return;
  stopRecording();
  wsSend({ type: 'end-class', classId: CLASS_ID });
  await apiFetch(`/api/classes/${CLASS_ID}/live/end`, {
    method: 'POST', headers: { Authorization: 'Bearer ' + currentUser.token }
  });
  leaveRoom();
  location.href = `class-details.html?id=${CLASS_ID}`;
}

// ── Load class context ────────────────────────────────────────────────────────
async function loadClassContext() {
  if (!CLASS_ID) {
    $('class-context').textContent = 'Demo room — open from a class page for full access control';
    return;
  }
  try {
    const res = await apiFetch(`/api/classes/${CLASS_ID}`, {
      headers: { Authorization: 'Bearer ' + currentUser.token }
    });
    if (!res) return;
    if (!res.ok) throw new Error('Forbidden');
    const cls = await res.json();
    $('class-context').textContent = cls.name + ' — live room';
  } catch {
    await Smartshala.alert('You do not have access to this live class.');
    location.href = IS_TEACHER ? 'teacher-dashboard.html' : 'student-dashboard.html';
  }
}


// ── Button wiring ─────────────────────────────────────────────────────────────
$('join-btn').addEventListener('click', async () => {
  intentClose = false;
  show($('join-btn'), false);
  show($('leave-btn'), true);
  if (IS_TEACHER) show($('end-btn'), true);
  openWs();
  await startMedia();
});

$('mic-btn').addEventListener('click', toggleMic);
$('cam-btn').addEventListener('click', toggleCam);

$('screen-btn').addEventListener('click', () => {
  if (screenSharing) stopScreenShare(); else startScreenShare();
});

$('record-btn').addEventListener('click', startRecording);
$('stop-rec-btn').addEventListener('click', stopRecording);
$('leave-btn').addEventListener('click', leaveRoom);
$('end-btn').addEventListener('click', endClass);

$('send-btn').addEventListener('click', sendChat);
$('ai-btn').addEventListener('click', () => {
  const v = chatInput.value.trim();
  askAi('/ai ' + v);
  chatInput.value = '';
});
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); sendChat(); }
});

// ── Init ──────────────────────────────────────────────────────────────────────
loadClassContext();
</script>
