<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password - Smartshala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand d-inline-flex gap-2 align-items-center" href="index.html">
        <span class="material-icons text-primary" style="font-size:24px">school</span>
        <span class="fw-bold">Smartshala</span>
      </a>
      <div class="d-flex gap-3">
        <a href="index.html" class="btn btn-light btn-sm">Home</a>
        <a href="login.html" class="btn btn-outline-primary btn-sm">Login</a>
      </div>
    </div>
  </nav>

  <main class="auth-container">
    <div class="auth-box">
      <div class="text-center mb-4">
        <div class="icon-shape icon-xxl rounded-circle bg-primary bg-opacity-10 text-primary mx-auto mb-3">
          <span class="material-icons" style="font-size:2rem">lock_reset</span>
        </div>
        <h1 style="font-size:1.5rem;margin:0 0 0.5rem">Reset Password</h1>
        <p class="text-muted small">Enter your email address and we'll send you a link to reset your password.</p>
      </div>

      <form id="reset-form">
        <div class="mb-3">
          <label class="form-label fw-semibold" for="reset-email">Email</label>
          <input type="email" class="form-control" id="reset-email" required placeholder="you@example.com" autocomplete="email" style="border-radius:50rem" />
        </div>

        <div id="success-msg" style="background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;padding:1rem;border-radius:0.75rem;margin:1rem 0;display:none"></div>
        <div id="error-msg" style="color:#dc2626;margin:.5rem 0;display:none"></div>

        <div class="d-grid">
          <button class="btn btn-primary" type="submit">
            <span id="submit-text">Send Reset Link</span>
            <span id="loading-text" style="display:none">Sending...</span>
          </button>
        </div>

        <p class="text-muted text-center mt-4 small">
          Remember your password? <a href="login.html" class="link-primary fw-semibold">Login here</a>
        </p>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/theme-toggle.js"></script>
  <script>
    const form = document.getElementById('reset-form');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    const submitBtn = form.querySelector('button[type="submit"]');
    const submitText = document.getElementById('submit-text');
    const loadingText = document.getElementById('loading-text');

    function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; successMsg.style.display = 'none'; }
    function showSuccess(msg) { successMsg.textContent = msg; successMsg.style.display = 'block'; errorMsg.style.display = 'none'; }
    function setLoading(loading) { submitBtn.disabled = loading; submitText.style.display = loading ? 'none' : 'inline'; loadingText.style.display = loading ? 'inline' : 'none'; }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      const email = document.getElementById('reset-email').value.trim();
      if (!email) { showError('Please enter your email address'); return; }
      if (!email.includes('@')) { showError('Please enter a valid email address'); return; }
      setLoading(true);
      if (window.Smartshala && window.Smartshala.SERVER_BASE) {
        try {
          const res = await fetch(window.Smartshala.SERVER_BASE + '/api/reset-password', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email }) });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Reset failed');
          showSuccess('Check your email for the reset link');
          form.reset();
        } catch (err) { showError(err.message); }
      } else {
        setTimeout(() => { showSuccess('In demo mode. With a real server, you would receive a reset link via email.'); form.reset(); }, 1000);
      }
      setLoading(false);
    });
  </script>
</body>
</html>
