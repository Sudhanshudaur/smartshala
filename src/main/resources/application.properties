spring.application.name=smartshala

# Server - reads PORT env var for Render deployment
server.port=${PORT:3000}
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,classpath:/static/html/
spring.jackson.property-naming-strategy=SNAKE_CASE

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload sizes (kept for multipart parsing, but upload feature is disabled)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
jwt.secret=${JWT_SECRET:dev_secret_change_me_to_a_minimum_thirty_two_byte_string}

# File Upload - DISABLED (feature coming soon)
# upload.dir=../uploads
upload.dir=${UPLOAD_DIR:./uploads}
upload.enabled=false
