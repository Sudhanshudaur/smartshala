<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Smartshala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #4338ca 0%, #6366f1 40%, #818cf8 100%);
      min-height: 100vh;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 80%, rgba(255,255,255,0.08) 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, rgba(255,255,255,0.06) 0%, transparent 50%);
      pointer-events: none;
    }
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      background: #fff;
      padding: 2.5rem;
      border-radius: 1.25rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.1);
      border: none;
    }
    .auth-card .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 2rem;
      font-size: 1.4rem;
      font-weight: 700;
      color: #6366f1;
      text-decoration: none;
    }
    .auth-card .brand-logo .material-icons { font-size: 28px; }
    .form-group {
      position: relative;
      margin-bottom: 1.1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: #374151;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1px solid #d4d4d4;
      border-radius: 0.6rem;
      font-size: 0.95rem;
      transition: all 0.2s;
      background: #fff;
      color: #171717;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    .form-group.error input,
    .form-group.error select { border-color: #ef4444; }
    .form-group .error-text {
      color: #ef4444;
      font-size: 0.82rem;
      margin-top: 0.25rem;
      display: none;
    }
    .form-group.error .error-text { display: block; }
    .toggle-password {
      position: absolute;
      right: 0.75rem;
      top: 2.3rem;
      color: #a3a3a3;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-password .material-icons { font-size: 20px; }
    .toggle-password:hover { color: #6366f1; }
    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1rem 0;
      font-size: 0.9rem;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #525252;
      cursor: pointer;
    }
    .remember-me input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      accent-color: #6366f1;
      cursor: pointer;
    }
    .forgot-link { color: #6366f1; text-decoration: none; font-size: 0.88rem; }
    .forgot-link:hover { text-decoration: underline; }
    .loading { pointer-events: none; opacity: 0.7; }
    .loading button[type="submit"] { position: relative; color: transparent; }
    .loading button[type="submit"]::after {
      content: '';
      position: absolute;
      inset: 0;
      margin: auto;
      width: 1.5rem;
      height: 1.5rem;
      border: 2px solid #fff;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Dark theme overrides */
    [data-theme="dark"] body { background: #0f0f0f !important; }
    [data-theme="dark"] body::before { display: none; }
    [data-theme="dark"] .auth-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    [data-theme="dark"] .auth-nav { background: transparent !important; box-shadow: none !important; }
    [data-theme="dark"] .auth-nav .navbar-brand span { color: #d4d4d4 !important; }
    [data-theme="dark"] .auth-nav .material-icons { color: #a5b4fc !important; }
    [data-theme="dark"] .form-group label { color: #d4d4d4; }
    [data-theme="dark"] .form-group input,
    [data-theme="dark"] .form-group select {
      background: #141414;
      border-color: #333;
      color: #e5e5e5;
    }
    [data-theme="dark"] .form-group input:focus,
    [data-theme="dark"] .form-group select:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }
    [data-theme="dark"] .remember-me { color: #a3a3a3; }
    [data-theme="dark"] .muted { color: #737373; }
    [data-theme="dark"] h1 { color: #f5f5f5 !important; }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="auth-nav navbar navbar-expand-lg sticky-top" style="padding:10px 0;background:transparent !important;box-shadow:none !important">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <span class="material-icons" style="font-size:28px;color:#e0e7ff">school</span>
        <span class="fw-bold" style="font-size:1.15rem;color:#fff">Smartshala</span>
      </a>
      <div class="d-flex gap-2">
        <a href="index.html" class="btn btn-outline-light btn-sm px-4">Home</a>
        <a href="register.html" class="btn btn-light btn-sm px-4">Register</a>
      </div>
    </div>
  </nav>

  <main class="auth-wrapper">
    <div class="auth-card">
      <a class="brand-logo" href="index.html">
        <span class="material-icons">school</span>
        Smartshala
      </a>
      <form id="auth-login-form" class="auth-form" novalidate>
        <h1 style="font-size:1.5rem;margin:0 0 1.5rem;text-align:center;color:#171717">Login to Your Account</h1>

        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required placeholder="you@example.com" autocomplete="email" />
          <div class="error-text">Please enter a valid email address</div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="Enter your password"
            autocomplete="current-password" />
          <button type="button" class="toggle-password" aria-label="Toggle password visibility">
            <span class="material-icons">visibility</span>
          </button>
          <div class="error-text">Please enter your password</div>
        </div>

        <div class="form-group">
          <label for="login-role">Role</label>
          <select id="login-role" required>
            <option value="">Select your role</option>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="admin">Admin</option>
          </select>
          <div class="error-text">Please select your role</div>
        </div>

        <div class="remember-forgot">
          <label class="remember-me">
            <input type="checkbox" id="remember-me" />
            Remember me
          </label>
          <a href="forgot-password.html" class="forgot-link">
            Forgot password?
          </a>
        </div>

        <div id="error-msg" class="error-msg" style="color:#dc2626;margin:.5rem 0;display:none"></div>

        <button class="btn btn-primary" type="submit" style="width:100%;padding:0.65rem">
          Login
        </button>

        <p class="muted" style="text-align:center;margin-top:1.5rem;color:#737373;font-size:0.9rem">
          Don't have an account? <a href="register.html" style="color:#6366f1;font-weight:600">Register here</a>
        </p>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/theme-toggle.js"></script>
  <script>
    // Get form elements
    const form = document.getElementById('auth-login-form');
    const errorMsg = document.getElementById('error-msg');
    const emailInput = document.getElementById('login-email');
    const passwordInput = document.getElementById('login-password');
    const roleSelect = document.getElementById('login-role');
    const rememberMe = document.getElementById('remember-me');

    // Password visibility toggle
    document.querySelector('.toggle-password').addEventListener('click', function () {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      this.querySelector('.material-icons').textContent = type === 'password' ? 'visibility' : 'visibility_off';
    });

    // Form validation helper
    function validateField(input, check) {
      const group = input.closest('.form-group');
      const isValid = check(input);
      group.classList.toggle('error', !isValid);
      return isValid;
    }

    // Show global error message
    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    // Add input event listeners for live validation
    emailInput.addEventListener('input', () => {
      validateField(emailInput, input =>
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value.trim()));
    });

    passwordInput.addEventListener('input', () => {
      validateField(passwordInput, input => input.value.length > 0);
    });

    roleSelect.addEventListener('change', () => {
      validateField(roleSelect, input => input.value !== '');
    });

    // Enhanced form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      // Validate all fields
      const isEmailValid = validateField(emailInput, input =>
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value.trim()));

      const isPasswordValid = validateField(passwordInput, input =>
        input.value.length > 0);

      const isRoleValid = validateField(roleSelect, input =>
        ['student', 'teacher', 'admin'].includes(input.value));

      if (!isEmailValid || !isPasswordValid || !isRoleValid) {
        return;
      }

      try {
        // Show loading state
        form.classList.add('loading');

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const role = roleSelect.value;

        // Call API
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Store auth data
        const authData = {
          token: data.token,
          user: data.user,
          role: data.user.role,
          name: data.user.name,
          email: data.user.email,
          isAuthenticated: true
        };

        if (rememberMe.checked) {
          localStorage.setItem('smartshala_auth', JSON.stringify(authData));
        } else {
          sessionStorage.setItem('smartshala_auth', JSON.stringify(authData));
        }

        // Redirect based on role
        window.location.href = data.user.role === 'admin' ? 'admin-dashboard.html' :
          (data.user.role === 'teacher' ? 'teacher-dashboard.html' : 'student-dashboard.html');

      } catch (err) {
        showError(err.message || 'Login failed. Please check your credentials.');
      } finally {
        form.classList.remove('loading');
      }
    });

    // Check if user is already logged in
    document.addEventListener('DOMContentLoaded', () => {
      const auth = JSON.parse(localStorage.getItem('smartshala_auth') ||
        sessionStorage.getItem('smartshala_auth') || 'null');
      if (auth && auth.isAuthenticated) {
        window.location.href = auth.role === 'admin' ? 'admin-dashboard.html' :
          (auth.role === 'teacher' ? 'teacher-dashboard.html' : 'student-dashboard.html');
      }
    });
  </script>
</body>

</html>
