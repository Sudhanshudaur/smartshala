<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recorded Lectures - Smartshala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .lecture-card { border-radius: 1rem; overflow: hidden; transition: all 0.25s; border: 1px solid #e5e5e5; background: #fff; }
    .lecture-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    .video-preview { aspect-ratio: 16/9; background: #171717; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
    .play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
    .video-preview:hover .play-overlay { opacity: 1; }
    .modal-video { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal-video.open { opacity: 1; pointer-events: auto; }
    .modal-video .video-wrapper { width: 90%; max-width: 1000px; position: relative; }
    .close-video { position: absolute; top: -40px; right: 0; color: white; background: none; border: 0; font-size: 1.5rem; cursor: pointer; }
    .tag { background: #f5f5f5; padding: 0.2rem 0.5rem; border-radius: 50rem; font-size: 0.8rem; color: #737373; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg dashboard-nav">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-inline-flex gap-2 align-items-center" href="index.html">
        <span class="material-icons text-primary" style="font-size:24px">school</span>
        <span class="fw-bold">Smartshala</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#dashNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="dashNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-4" id="role-nav"></ul>
        <a href="#" id="logout-btn" class="btn btn-outline-primary btn-sm">
          <span class="material-icons" style="font-size:16px">logout</span> Logout
        </a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="page-header mb-4">
      <div class="d-flex justify-content-between align-items-center position-relative flex-wrap gap-3" style="z-index:1">
        <div>
          <h1><span class="material-icons me-2" style="font-size:1.5rem;vertical-align:middle">video_library</span>Recorded Lectures</h1>
          <p id="lecture-subtitle">Watch recorded class sessions</p>
        </div>
        <div class="d-flex gap-2 flex-wrap" id="upload-tools">
          <select id="class-select" class="form-select" style="min-width:220px;border-radius:50rem">
            <option value="">Select class</option>
          </select>
          <button class="btn btn-light" id="upload-btn">
            <span class="material-icons" style="font-size:16px;margin-right:4px">upload</span> Upload Recording
          </button>
          <input type="file" id="upload-input" accept="video/*" style="display:none" />
        </div>
      </div>
    </div>

    <div class="card rounded-4 border-0" style="background:#eef2ff; box-shadow:inset 0 2px 4px rgba(0,0,0,0.02)">
      <div class="card-body p-4">
        <div class="row g-4" id="lectures-grid"></div>
      </div>
    </div>
  </main>

  <div class="modal-video" id="video-modal">
    <div class="video-wrapper">
      <button class="close-video" id="close-video">x</button>
      <video id="video-player" controls style="width:100%;display:block;border-radius:1rem">
        Your browser does not support video playback.
      </video>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/theme-toggle.js"></script>
  <script>
    const auth = Smartshala.getCurrentUser();
    if (!auth || !auth.isAuthenticated || !['teacher', 'student'].includes(auth.role)) {
      window.location.href = 'login.html';
    }

    const grid = document.getElementById('lectures-grid');
    const modal = document.getElementById('video-modal');
    const player = document.getElementById('video-player');
    const uploadInput = document.getElementById('upload-input');
    const uploadTools = document.getElementById('upload-tools');
    const classSelect = document.getElementById('class-select');

    document.getElementById('role-nav').innerHTML = auth.role === 'teacher'
      ? '<li class="nav-item"><a class="nav-link" href="teacher-dashboard.html"><span class="material-icons">dashboard</span> Dashboard</a></li><li class="nav-item"><a class="nav-link" href="liveclass.html"><span class="material-icons">videocam</span> Live Class</a></li><li class="nav-item"><a class="nav-link active" href="lectures.html"><span class="material-icons">video_library</span> Lectures</a></li>'
      : '<li class="nav-item"><a class="nav-link" href="student-dashboard.html"><span class="material-icons">dashboard</span> Dashboard</a></li><li class="nav-item"><a class="nav-link" href="liveclass.html"><span class="material-icons">videocam</span> Live Class</a></li><li class="nav-item"><a class="nav-link active" href="lectures.html"><span class="material-icons">video_library</span> Lectures</a></li><li class="nav-item"><a class="nav-link" href="notes.html"><span class="material-icons">note</span> Notes</a></li>';

    if (auth.role !== 'teacher') {
      uploadTools.style.display = 'none';
      document.getElementById('lecture-subtitle').textContent = 'Watch lectures from your enrolled classes';
    } else {
      document.getElementById('lecture-subtitle').textContent = 'Upload and manage class recordings';
    }

    function formatDuration(seconds) {
      const mins = Math.floor((seconds || 0) / 60);
      const secs = Math.floor((seconds || 0) % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    async function renderLectures() {
      try {
        const res = await apiFetch('/api/lectures', { headers: { Authorization: `Bearer ${auth.token}` } });
        if (!res) return;
        if (!res.ok) throw new Error('Failed to load lectures');
        const lectures = await res.json();
        if (!lectures.length) {
          grid.innerHTML = `<div class="col-12"><div class="empty-state"><span class="material-icons">video_library</span><p>No lectures yet.</p></div></div>`;
          return;
        }

        grid.innerHTML = lectures.map(lecture => `
          <div class="col-lg-4 col-md-6">
            <div class="lecture-card">
              <div class="video-preview" data-url="${lecture.url}">
                <span class="material-icons text-white" style="font-size:3rem">play_circle_filled</span>
                <div class="play-overlay"><span class="material-icons text-white" style="font-size:3rem">play_circle_filled</span></div>
              </div>
              <div class="p-3">
                <h6 class="fw-bold mb-1">${lecture.title || 'Lecture'}</h6>
                <div class="text-muted small mb-2">${new Date(lecture.date || lecture.created_at || Date.now()).toLocaleDateString()} &middot; ${formatDuration(lecture.duration)}</div>
                <div class="d-flex gap-1 mb-2">
                  <span class="tag">${lecture.subject || 'Lecture'}</span>
                  <span class="tag">${lecture.instructor || 'Teacher'}</span>
                </div>
                <a href="${lecture.url}" download class="btn btn-outline-primary btn-sm w-100">Download</a>
              </div>
            </div>
          </div>
        `).join('');

        grid.querySelectorAll('.video-preview').forEach(el => {
          el.addEventListener('click', () => {
            player.src = el.dataset.url;
            modal.classList.add('open');
            player.play();
          });
        });
      } catch (err) {
        grid.innerHTML = `<div class="col-12"><div class="empty-state"><span class="material-icons">error</span><p>Failed to load lectures.</p></div></div>`;
      }
    }

    async function loadTeacherClasses() {
      if (auth.role !== 'teacher') return;
      try {
        const res = await apiFetch('/api/classes', { headers: { Authorization: `Bearer ${auth.token}` } });
        if (!res) return;
        const classes = await res.json();
        classSelect.innerHTML = '<option value="">Select class</option>' + classes.map(cls => `<option value="${cls.id}">${cls.name}</option>`).join('');
        if (classes.length === 1) classSelect.value = classes[0].id;
      } catch (err) {
        classSelect.innerHTML = '<option value="">No classes loaded</option>';
      }
    }

    document.getElementById('upload-btn').addEventListener('click', () => showComingSoonModal());
    uploadInput.addEventListener('change', async () => {
      const file = uploadInput.files[0];
      if (!file) return;
      if (auth.role !== 'teacher') {
        await Smartshala.alert('Only teachers can upload lectures.');
        return;
      }
      if (!classSelect.value) {
        await Smartshala.alert('Select a class before uploading.');
        uploadInput.value = '';
        return;
      }

      const title = await Smartshala.prompt('Lecture title:', file.name.replace(/\.[^/.]+$/, ''));
      if (!title) return;
      const formData = new FormData();
      formData.append('lecture', file);
      formData.append('classId', classSelect.value);
      formData.append('title', title);

      try {
        const res = await apiFetch('/api/lectures/upload', { method: 'POST', headers: { Authorization: `Bearer ${auth.token}` }, body: formData });
        if (!res) return;
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Upload failed');
        await Smartshala.alert('Lecture uploaded', 'Success');
        renderLectures();
      } catch (err) {
        await Smartshala.alert('Upload failed: ' + err.message);
      }
    });

    document.getElementById('close-video').addEventListener('click', () => {
      modal.classList.remove('open');
      player.pause();
    });
    document.getElementById('logout-btn').addEventListener('click', event => {
      event.preventDefault();
      Smartshala.logout();
    });

    loadTeacherClasses();
    renderLectures();
  </script>
</body>
</html>
