<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Planner - Smartshala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .planner-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; }
    .planner-output { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.85rem; }
    .planner-card { border: 1px solid #e5e7eb; border-radius: 0.75rem; padding: 1rem; background: #fff; }
    .planner-card h6 { color: #3730a3; }
    .step-number { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #eef2ff; color: #4f46e5; font-weight: 800; }
    @media (max-width: 992px) { .planner-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg dashboard-nav">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-inline-flex gap-2 align-items-center" href="index.html">
        <span class="material-icons text-primary" style="font-size:24px">school</span>
        <span class="fw-bold">Smartshala</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#dashNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="dashNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-4" id="role-nav"></ul>
        <div class="d-flex align-items-center gap-3">
          <div class="profile-btn">
            <div class="text-end">
              <span class="profile-name" id="profile-name">User</span>
              <span class="profile-role d-block" id="profile-role">Role</span>
            </div>
            <img src="https://ui-avatars.com/api/?name=User&background=random" alt="Profile" id="profile-img" style="width:36px;height:36px;border-radius:50%;border:2px solid #e5e5e5">
          </div>
          <a href="#" id="logout-btn" class="btn btn-outline-primary btn-sm">
            <span class="material-icons" style="font-size:16px">logout</span> Logout
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="page-header mb-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 position-relative" style="z-index:1">
        <div>
          <h1><span class="material-icons me-2" style="font-size:1.5rem;vertical-align:middle">route</span>AI Study Planner</h1>
          <p>Build a learning path and timetable from your class goals</p>
        </div>
        <span class="badge bg-light text-primary rounded-pill px-3 py-2" id="class-count">Loading classes</span>
      </div>
    </div>

    <div class="planner-grid mb-4">
      <section class="card rounded-4 shadow-sm">
        <div class="card-header bg-transparent px-4 py-3">
          <h5 class="mb-0 fw-bold">AI Path Finder</h5>
        </div>
        <div class="card-body p-4">
          <form id="path-form" class="d-flex flex-column gap-3">
            <select id="path-class" class="form-select"></select>
            <input id="path-goal" class="form-control" placeholder="Goal, e.g. Master algebra before exam" required>
            <div class="row g-3">
              <div class="col-md-6">
                <select id="path-level" class="form-select">
                  <option value="beginner">Beginner</option>
                  <option value="intermediate">Intermediate</option>
                  <option value="advanced">Advanced</option>
                </select>
              </div>
              <div class="col-md-6">
                <input id="path-hours" class="form-control" type="number" min="2" max="40" value="6" placeholder="Weekly hours">
              </div>
            </div>
            <textarea id="path-focus" class="form-control" rows="3" placeholder="Weak areas or syllabus points"></textarea>
            <button class="btn btn-primary" type="submit">
              <span class="material-icons" style="font-size:16px;margin-right:4px">auto_awesome</span>
              Generate Path
            </button>
          </form>
        </div>
      </section>

      <section class="card rounded-4 shadow-sm">
        <div class="card-header bg-transparent px-4 py-3">
          <h5 class="mb-0 fw-bold">Timetable Scheduler</h5>
        </div>
        <div class="card-body p-4">
          <form id="time-form" class="d-flex flex-column gap-3">
            <select id="time-class" class="form-select"></select>
            <input id="time-goal" class="form-control" placeholder="Goal, e.g. Prepare for science test" required>
            <div class="row g-3">
              <div class="col-md-4">
                <input id="time-days" class="form-control" type="number" min="1" max="30" value="7" placeholder="Days">
              </div>
              <div class="col-md-4">
                <input id="time-hours" class="form-control" type="number" min="1" max="8" value="2" placeholder="Hours/day">
              </div>
              <div class="col-md-4">
                <input id="time-start" class="form-control" type="date">
              </div>
            </div>
            <select id="time-preferred" class="form-select">
              <option>Morning</option>
              <option>Afternoon</option>
              <option selected>Evening</option>
              <option>Night</option>
            </select>
            <textarea id="time-focus" class="form-control" rows="3" placeholder="Topics to prioritize"></textarea>
            <button class="btn btn-primary" type="submit">
              <span class="material-icons" style="font-size:16px;margin-right:4px">event_note</span>
              Build Timetable
            </button>
          </form>
        </div>
      </section>
    </div>

    <section class="card rounded-4 shadow-sm">
      <div class="card-header bg-transparent px-4 py-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold">AI Plan Output</h5>
        <button id="clear-output" class="btn btn-outline-secondary btn-sm">Clear</button>
      </div>
      <div class="card-body p-4" id="planner-output">
        <p class="text-muted mb-0">Generate a path or timetable to see it here.</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/theme-toggle.js"></script>
  <script>
    const auth = Smartshala.getCurrentUser();
    if (!auth || !auth.isAuthenticated || !['student', 'teacher', 'admin'].includes(auth.role)) {
      window.location.href = 'login.html';
    }

    const roleNav = document.getElementById('role-nav');
    roleNav.innerHTML = auth.role === 'teacher'
      ? '<li class="nav-item"><a class="nav-link" href="teacher-dashboard.html"><span class="material-icons">dashboard</span> Dashboard</a></li><li class="nav-item"><a class="nav-link" href="liveclass.html"><span class="material-icons">videocam</span> Live Class</a></li><li class="nav-item"><a class="nav-link" href="leaderboard.html"><span class="material-icons">leaderboard</span> Leaderboard</a></li><li class="nav-item"><a class="nav-link active" href="ai-planner.html"><span class="material-icons">route</span> AI Planner</a></li>'
      : '<li class="nav-item"><a class="nav-link" href="student-dashboard.html"><span class="material-icons">dashboard</span> Dashboard</a></li><li class="nav-item"><a class="nav-link" href="liveclass.html"><span class="material-icons">videocam</span> Live Class</a></li><li class="nav-item"><a class="nav-link" href="lectures.html"><span class="material-icons">video_library</span> My Lectures</a></li><li class="nav-item"><a class="nav-link active" href="ai-planner.html"><span class="material-icons">route</span> AI Planner</a></li>';

    document.getElementById('profile-name').textContent = auth.name || 'User';
    document.getElementById('profile-role').textContent = auth.role.charAt(0).toUpperCase() + auth.role.slice(1);
    document.getElementById('profile-img').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(auth.name || 'User')}&background=random`;

    const output = document.getElementById('planner-output');
    const pathClass = document.getElementById('path-class');
    const timeClass = document.getElementById('time-class');

    function headers() {
      return { 'Authorization': `Bearer ${auth.token}`, 'Content-Type': 'application/json' };
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    async function loadClasses() {
      try {
        const res = await apiFetch('/api/classes', { headers: { 'Authorization': `Bearer ${auth.token}` } });
        const classes = res.ok ? await res.json() : [];
        const options = ['<option value="">General study plan</option>']
          .concat(classes.map(cls => `<option value="${cls.id}">${escapeHtml(cls.name)}</option>`))
          .join('');
        pathClass.innerHTML = options;
        timeClass.innerHTML = options;
        document.getElementById('class-count').textContent = `${classes.length} class${classes.length === 1 ? '' : 'es'} available`;
      } catch (err) {
        pathClass.innerHTML = '<option value="">General study plan</option>';
        timeClass.innerHTML = '<option value="">General study plan</option>';
        document.getElementById('class-count').textContent = 'Classes unavailable';
      }
    }

    document.getElementById('path-form').addEventListener('submit', async event => {
      event.preventDefault();
      output.innerHTML = '<p class="text-muted mb-0">Generating learning path...</p>';
      try {
        const res = await apiFetch('/api/ai/path-finder', {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({
            class_id: pathClass.value,
            goal: document.getElementById('path-goal').value,
            current_level: document.getElementById('path-level').value,
            weekly_hours: parseInt(document.getElementById('path-hours').value || '6', 10),
            focus_areas: document.getElementById('path-focus').value
          })
        });
        if (!res) return;
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Path generation failed');
        renderPath(data);
      } catch (err) {
        output.innerHTML = `<p class="text-danger mb-0">${escapeHtml(err.message)}</p>`;
      }
    });

    document.getElementById('time-form').addEventListener('submit', async event => {
      event.preventDefault();
      output.innerHTML = '<p class="text-muted mb-0">Building timetable...</p>';
      try {
        const res = await apiFetch('/api/ai/timetable', {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({
            class_id: timeClass.value,
            goal: document.getElementById('time-goal').value,
            days: parseInt(document.getElementById('time-days').value || '7', 10),
            hours_per_day: parseInt(document.getElementById('time-hours').value || '2', 10),
            preferred_time: document.getElementById('time-preferred').value,
            start_date: document.getElementById('time-start').value,
            focus_areas: document.getElementById('time-focus').value
          })
        });
        if (!res) return;
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Timetable generation failed');
        renderTimetable(data);
      } catch (err) {
        output.innerHTML = `<p class="text-danger mb-0">${escapeHtml(err.message)}</p>`;
      }
    });

    function renderPath(data) {
      output.innerHTML = `
        <div class="mb-4">
          <h5 class="fw-bold mb-1">${escapeHtml(data.goal)}</h5>
          <p class="text-muted mb-0">${escapeHtml(data.summary)}</p>
        </div>
        <div class="planner-output">
          ${(data.path || []).map(step => `
            <div class="planner-card">
              <div class="d-flex align-items-center gap-2 mb-2">
                <span class="step-number">${step.week}</span>
                <h6 class="mb-0 fw-bold">${escapeHtml(step.title)}</h6>
              </div>
              <p class="small text-muted mb-2">${escapeHtml(step.targetHours)} target hours</p>
              <ul class="small mb-3">${(step.tasks || []).map(task => `<li>${escapeHtml(task)}</li>`).join('')}</ul>
              <strong class="small">Checkpoint:</strong>
              <div class="small text-muted">${escapeHtml(step.checkpoint)}</div>
            </div>
          `).join('')}
        </div>
        <div class="alert alert-primary rounded-4 mt-4 mb-0">
          ${(data.tips || []).map(tip => `<div>${escapeHtml(tip)}</div>`).join('')}
        </div>`;
    }

    function renderTimetable(data) {
      output.innerHTML = `
        <div class="mb-4">
          <h5 class="fw-bold mb-1">${escapeHtml(data.goal)}</h5>
          <p class="text-muted mb-0">${escapeHtml(data.className)} - ${escapeHtml(data.totalHours)} total hours</p>
        </div>
        <div class="planner-output">
          ${(data.schedule || []).map(day => `
            <div class="planner-card">
              <div class="d-flex justify-content-between gap-2 mb-2">
                <h6 class="mb-0 fw-bold">Day ${escapeHtml(day.day)} - ${escapeHtml(day.topic)}</h6>
                <span class="badge bg-primary rounded-pill">${escapeHtml(day.hours)}h</span>
              </div>
              <p class="small text-muted mb-2">${escapeHtml(day.date)} - ${escapeHtml(day.time)}</p>
              <ul class="small mb-3">${(day.plan || []).map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>
              <strong class="small">Output:</strong>
              <div class="small text-muted">${escapeHtml(day.output)}</div>
            </div>
          `).join('')}
        </div>
        <div class="alert alert-primary rounded-4 mt-4 mb-0">
          ${(data.reminders || []).map(item => `<div>${escapeHtml(item)}</div>`).join('')}
        </div>`;
    }

    document.getElementById('clear-output').addEventListener('click', () => {
      output.innerHTML = '<p class="text-muted mb-0">Generate a path or timetable to see it here.</p>';
    });

    document.getElementById('logout-btn').addEventListener('click', event => {
      event.preventDefault();
      Smartshala.logout();
    });

    document.getElementById('time-start').value = new Date().toISOString().slice(0, 10);
    loadClasses();
  </script>
</body>
</html>
